---
# Toggle installation
journal_forwarder_install: true
journal_forwarder_remove_repo: true  # remove Fluent Bit repo on uninstall

# Graylog GELF input settings
graylog_gelf_host: graylog.example.com
graylog_gelf_port: 12201
graylog_gelf_mode: tcp

# Fluent Bit runtime settings
graylog_fluent_bit_workers: 2

# Optional k3s Kubernetes Event exporter bridge.
journal_forwarder_k3s_event_exporter_enabled: false
journal_forwarder_k3s_event_exporter_image: ghcr.io/resmoio/kubernetes-event-exporter:v1.7
journal_forwarder_k3s_event_exporter_manifest_path: /var/lib/rancher/k3s/server/manifests/kubernetes-event-exporter.yaml
journal_forwarder_k3s_event_exporter_log_path: /var/log/kubernetes-events/events.json
journal_forwarder_k3s_event_exporter_lua_path: /etc/fluent-bit/kubernetes-event-normalize.lua
journal_forwarder_k3s_event_exporter_namespace: logging
journal_forwarder_k3s_event_exporter_host_network: true
journal_forwarder_tag: journald
journal_forwarder_read_from_tail: true
journal_forwarder_storage_path: /var/lib/fluent-bit
journal_forwarder_systemd_db: "{{ journal_forwarder_storage_path }}/flb_systemd.db"

# Audit log forwarding
journal_forwarder_audit_enabled: true
journal_forwarder_audit_remove: true  # remove audit packages on uninstall
journal_forwarder_audit_tag: audit
journal_forwarder_audit_db: "{{ journal_forwarder_storage_path }}/flb_audit.db"
journal_forwarder_audit_rules_file: /etc/audit/rules.d/journal-forwarder-package.rules
journal_forwarder_legacy_audit_rules_files:
  - /etc/audit/rules.d/package.rules
  - /etc/audit/rules.d/logbeat-package.rules

# Additional Linux security/application log files
journal_forwarder_security_files_enabled: true
journal_forwarder_security_files_tag: security_files
journal_forwarder_security_files_db: "{{ journal_forwarder_storage_path }}/flb_security_files.db"
journal_forwarder_security_log_paths:
  - /var/log/auth.log
  - /var/log/secure
  - /var/log/nginx/*.log
  - /var/log/apache2/*.log
  - /var/log/httpd/*.log
...
